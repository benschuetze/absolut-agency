<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <!--
      Four of the same mark, because the people who fetch it disagree about
      what to ask for. Google's search results reach for /favicon.ico before
      anything declared, and it wants at least 48px square — which is why the
      results page showed a globe while a perfectly good SVG sat next to it.
      Browsers that prefer the vector still get it; iOS gets its own.
    -->
    <link rel="icon" href="/favicon.ico" sizes="16x16 32x32 48x48" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="96x96" href="/favicon-96.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <meta name="theme-color" content="#f4e9e7" />

    <title>silodom agency — booking &amp; artist management</title>
    <meta
      name="description"
      content="Booking and artist management from Saarbrücken, out of the Silodom. Ten artists, each with their own sound — techno, house, tech house, drum &amp; bass. Different styles. One home."
    />
    <link rel="canonical" href="https://silodom-agency.com/" />

    <meta property="og:site_name" content="silodom agency" />
    <meta property="og:title" content="silodom agency — booking &amp; artist management" />
    <meta
      property="og:description"
      content="Booking and artist management from Saarbrücken, out of the Silodom. Ten artists, each with their own sound. Different styles. One home."
    />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://silodom-agency.com/" />
    <meta property="og:locale" content="en_GB" />
    <meta property="og:image" content="https://silodom-agency.com/share.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="The silodom agency roster" />
    <meta name="twitter:card" content="summary_large_image" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
