name: CI

# Every pull request and every push to main: types, data, build and the browser
# tests. Deploying stays in deploy.yml; this workflow can only read.
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      # Same reviewed commits as deploy.yml; see the note there on why not tags.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm

      # No install scripts, as in deploy.yml. Playwright fetches its browsers in
      # the explicit step below instead.
      - run: npm ci --ignore-scripts
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npx playwright install --with-deps chromium webkit firefox
      - run: npx playwright test
        env:
          CI: 'true'
